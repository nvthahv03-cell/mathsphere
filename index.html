<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#002b49"><meta name="description" content="MathSphere · HSG12 PRO - Học tập và luyện thi Toán 12"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./favicon.ico"><title>MathSphere · HSG12 PRO</title><style>
:root{--navy:#002b49;--navy2:#063e61;--gold:#ffd32a;--bg:#f3f6fb;--ink:#183047;--muted:#65788c;--line:#dce5ef;--orange:#e25a26;--ok:#14866a}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(125deg,var(--navy),var(--navy2));color:white;padding:16px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}header img{width:46px;height:46px;object-fit:contain;border-radius:11px}header h1{margin:0;font-size:23px;color:var(--gold)}header small{opacity:.83}header .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{border-radius:30px;background:#ffffff1b;padding:6px 11px;font-size:12px}nav{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto;display:flex;gap:4px;padding:8px max(12px,calc((100vw - 1200px)/2))}nav button{white-space:nowrap;border:0;border-radius:10px;padding:10px 13px;background:transparent;color:var(--muted);font-weight:700}nav button.active{background:#e5f2fb;color:var(--navy)}main{max-width:1200px;margin:24px auto;padding:0 16px 60px}.hero{background:linear-gradient(120deg,#063b60,#07537c);border-radius:20px;padding:26px;color:white;display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h2{margin:0 0 7px;font-size:27px}.hero p{margin:0;opacity:.88}.hero img{width:84px;height:84px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 4px 14px #153c5a08}.card h3{margin:0 0 10px;font-size:17px}.card p{color:var(--muted);margin:7px 0}.metric{font-size:30px;font-weight:800;color:var(--navy)}.btn{background:var(--navy);color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:700}.btn.alt{background:#edf4f9;color:var(--navy)}.btn.orange{background:var(--orange)}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;padding:10px 12px;border:1px solid #c8d6e3;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}.checkrow{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.checkrow label{font-weight:500;margin:0}.note{background:#fff6e9;border-left:4px solid #e4a12b;padding:12px;border-radius:8px;margin:12px 0;color:#765321}.good{background:#eaf8f2;border-left:4px solid var(--ok);padding:12px;border-radius:8px;margin:12px 0}.muted{color:var(--muted)}.pill{display:inline-block;background:#eaf1f8;color:#365a77;border-radius:30px;padding:3px 9px;font-size:12px;margin:3px 4px 3px 0}.list{display:grid;gap:12px}.q{border:1px solid var(--line);padding:15px;border-radius:12px;background:#fff}.q strong{font-size:15px}.choices{display:grid;gap:7px;margin:12px 0}.choices label{font-weight:400;font-size:14px;margin:0;padding:9px;border:1px solid #e2e8ef;border-radius:8px}.choices input{margin-right:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}.toolbar select{max-width:230px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border:1px solid var(--line);text-align:center}td:first-child,th:first-child{text-align:left}th{background:#eff5fa}.scroll{overflow-x:auto}.hidden{display:none!important}.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.step b{background:#e6f0f7;color:var(--navy);padding:5px 11px;border-radius:9px}.footer{color:var(--muted);font-size:12px;text-align:center;margin:20px}.result{font-size:22px;font-weight:800;color:var(--ok)}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}header .right{margin-left:0}.hero{padding:19px}.hero h2{font-size:22px}.hero img{width:60px;height:60px}main{margin:14px auto}nav button{padding:9px 10px}}
</style></head><body><header><img src="./icon-192.png" alt="MathSphere"><div><h1>MathSphere <span style="color:white">HSG12 PRO</span></h1><small>by TS. Nguyễn Văn Thà · Bồi dưỡng học sinh giỏi Toán 12</small></div><div class="right"><span class="tag" id="modeTag">V2 · Frontend độc lập</span><button class="btn alt" id="installBtn" style="display:none">Cài ứng dụng</button></div></header><nav id="nav"></nav><main id="app"></main><script>
'use strict';const KEY='mathsphere_hsg12_v2_local';const sections=[['home','Tổng quan'],['learn','Chuyên đề'],['practice','Luyện tập'],['exam','Thi thử'],['bank','Ngân hàng câu hỏi'],['matrix','Ma trận – Đặc tả'],['creator','Bạn ra đề'],['research','Nghiên cứu toàn cầu'],['progress','Kết quả'],['audit','Kiểm định'],['settings','Cài đặt'],['ai','AI MathSphere']];
const seeds=[
{id:'M001',topic:'Đạo hàm',level:'VD',context:'TT',competency:'TDLL',type:'MCQ',prompt:'Cho hàm số f(x)=x³−3x. Hàm số có bao nhiêu điểm cực trị?',options:['0','1','2','3'],answer:2,solution:'f′(x)=3x²−3=3(x−1)(x+1). Đạo hàm đổi dấu tại x=−1 và x=1, nên có hai điểm cực trị.',status:'DEMO'},
{id:'M002',topic:'Mũ – logarit',level:'H',context:'TT',competency:'GQVD',type:'MCQ',prompt:'Giải phương trình log₂(x−1)=3.',options:['x=7','x=8','x=9','x=10'],answer:2,solution:'Điều kiện x>1. Ta có x−1=2³=8, suy ra x=9.',status:'DEMO'},
{id:'M003',topic:'Đạo hàm',level:'VD',context:'TH',competency:'MHH',type:'MCQ',prompt:'Một hình chữ nhật có chu vi 40 m. Diện tích lớn nhất của hình chữ nhật bằng bao nhiêu?',options:['80 m²','90 m²','100 m²','120 m²'],answer:2,solution:'Gọi chiều dài x, chiều rộng 20−x, với 0<x<20. S=x(20−x)=100−(x−10)²≤100; đạt khi x=10.',status:'DEMO'},
{id:'M004',topic:'Xác suất',level:'H',context:'TT',competency:'GQVD',type:'MCQ',prompt:'Tung một đồng xu cân đối hai lần. Xác suất có đúng một lần xuất hiện mặt ngửa là bao nhiêu?',options:['1/4','1/2','3/4','1'],answer:1,solution:'Không gian mẫu gồm NN, NS, SN, SS đồng khả năng. Có hai kết quả đúng một lần ngửa nên xác suất 2/4=1/2.',status:'DEMO'},
{id:'T001',topic:'Đạo hàm',level:'VD',context:'TT',competency:'TDLL',type:'TF',scheme:'independent',prompt:'Xét hàm số f(x)=x²−4x+3. Đánh giá các khẳng định sau:',statements:['f′(x)=2x−4.','Hàm số nghịch biến trên (−∞;2).','Giá trị nhỏ nhất của f trên ℝ là −1.','Đồ thị hàm số cắt trục tung tại điểm (0;−3).'],answer:[true,true,true,false],solution:'a đúng theo quy tắc đạo hàm; b đúng vì f′<0 khi x<2; c đúng vì f(x)=(x−2)²−1; d sai vì f(0)=3.',status:'DEMO'},
{id:'T002',topic:'Mũ – logarit',level:'VDC',context:'TT',competency:'TDLL',type:'TF',scheme:'ladder',prompt:'Cho g(x)=log₂(x), với x>0. Đánh giá các khẳng định:',statements:['g(1)=0.','g(x) là hàm đồng biến trên (0;+∞).','Phương trình g(x)+g(x−1)=1 có nghiệm x=2.','Với mọi x>1, g(x)+g(x−1)>g(2x−1).'],answer:[true,true,true,false],solution:'a đúng; b đúng vì cơ số 2>1; c đúng vì log₂2+log₂1=1; d sai: lấy x=2 thì vế trái bằng 1, vế phải log₂3>1. Đây chỉ là ví dụ giao diện, chưa phải câu phân hóa HSG VDC+.',status:'DEMO'},
{id:'S001',topic:'Nguyên hàm – tích phân',level:'VD',context:'TT',competency:'GQVD',type:'SA',prompt:'Tính tích phân từ 0 đến 2 của (2x+1)dx. Nhập kết quả bằng số.',answer:'6',solution:'Nguyên hàm là x²+x. Thay cận: (4+2)−0=6.',status:'DEMO'}];
const initial={questions:seeds,attempts:[],matrices:[],profile:'Học sinh thử nghiệm',role:'student',examConfig:{tfScheme:'ladder'},draft:null,audits:[],handoffs:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data=structuredClone(initial)}let page='home',answers={},examStarted=false,examIds=[],examStart=0,examMinutes=30,submitted=false,examTicker=null;const EXAM_KEY='mathsphere_hsg12_v2_exam';function persistExam(){try{localStorage.setItem(EXAM_KEY,JSON.stringify({examIds,examStart,examMinutes,answers,submitted}))}catch(e){console.warn('Không lưu được bài thi:',e)}}function clearExam(){try{localStorage.removeItem(EXAM_KEY)}catch(e){}examStarted=false;clearInterval(examTicker);examTicker=null}function restoreExam(){try{const e=JSON.parse(localStorage.getItem(EXAM_KEY)||'null');if(!e||!Array.isArray(e.examIds)||!e.examIds.length||e.submitted)return;examIds=e.examIds.filter(id=>qBy(id));if(!examIds.length)return;examStart=Number(e.examStart);examMinutes=Number(e.examMinutes);if(!Number.isFinite(examStart)||!Number.isFinite(examMinutes)||examMinutes<1)return;answers=e.answers||{};submitted=false;examStarted=true;page='exam'}catch(e){console.warn('Không khôi phục được bài thi:',e)}}function tickExam(){if(!examStarted||submitted)return;const remain=Math.max(0,Math.ceil((examStart+examMinutes*60000-Date.now())/1000)),el=$('elapsed');if(el)el.textContent='Thời gian còn lại: '+String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');if(remain===0){page='exam';if(!$('scorePanel'))render('exam');showResult(examIds,'Thi thử (hết giờ)');clearExam()}}function startTicker(){clearInterval(examTicker);if(examStarted&&!submitted){tickExam();if(examStarted)examTicker=setInterval(tickExam,1000)}}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),fmt=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:2}),qBy=id=>data.questions.find(q=>q.id===id),types={MCQ:'4 phương án',TF:'Đúng/Sai',SA:'Trả lời ngắn'},levels={B:'Biết',H:'Hiểu',VD:'Vận dụng',VDC:'Vận dụng cao'},context={TT:'Thuần túy',TH:'Thực tiễn'},comp={TDLL:'Tư duy và lập luận',MHH:'Mô hình hóa',GQVD:'Giải quyết vấn đề'};

function ai(){const role=window.msAiRole||'student',space=window.msAiSpace||'tutor';const teacher=[['research','Nghiên cứu Toán học toàn cầu'],['matrix','Thiết kế ma trận – đặc tả'],['creator','Ra đề và kiểm định']],student=[['tutor','Gia sư Toán học'],['hint','Gợi ý từng bước'],['practice','Luyện tư duy HSG']];const opts=role==='teacher'?teacher:student;const examples={research:'Tìm hướng tiếp cận các bài toán đạo hàm HSG 12; yêu cầu ghi rõ nguồn và mức độ phù hợp.',matrix:'Đề xuất ma trận HSG 12 theo bốn mức nhận thức, hai dạng toán và ba năng lực.',creator:'Tạo yêu cầu sinh một câu Đúng/Sai bậc thang H–VD–VDC–VDC+, kiểm định A1–A3 và B1–B3.',tutor:'Hướng dẫn em xét tính đơn điệu của f(x)=x³−3x+1.',hint:'Em đang mắc ở bước tìm cực trị. Hãy gợi ý bước tiếp theo, chưa đưa ngay đáp án.',practice:'Gợi ý một bài luyện tập đạo hàm phù hợp HSG 12, chưa cho đáp án.'};if(!opts.some(x=>x[0]===space))window.msAiSpace=opts[0][0];const active=window.msAiSpace||space;return `<h2>AI MathSphere · ${role==='teacher'?'Giáo viên':'Học sinh'}</h2><div class="note"><b>Chế độ Frontend – chưa kết nối Gemini.</b> Vai trò ở đây chỉ để xem thử giao diện, <b>không phải xác thực hay phân quyền bảo mật</b>. Không gửi dữ liệu cá nhân hoặc đề bảo mật vào bản thử nghiệm.</div><div class="two"><div class="card"><img src="./ai-mathsphere.png" alt="Robot AI MathSphere" style="width:160px;max-width:100%;height:auto;display:block;margin:0 auto 12px"><label>Không gian sử dụng</label><select id="aiRole"><option value="student" ${role==='student'?'selected':''}>Học sinh</option><option value="teacher" ${role==='teacher'?'selected':''}>Giáo viên</option></select><label>Trợ lý chuyên môn</label><select id="aiSpace">${opts.map(([id,n])=>`<option value="${id}" ${active===id?'selected':''}>${n}</option>`).join('')}</select><p class="muted">${role==='teacher'?'Giáo viên chuẩn bị học liệu, ma trận và đề; giáo viên phải phê duyệt trước khi công bố.':'AI hỗ trợ theo hướng gợi mở; không cung cấp đáp án của bài thi đang diễn ra.'}</p></div><div class="card"><h3>Soạn yêu cầu gửi AI</h3><label>Nội dung yêu cầu</label><textarea id="aiPrompt" rows="7" placeholder="Nhập câu hỏi Toán học...">${esc(window.msAiDraft??examples[active]??'')}</textarea><div class="actions"><button class="btn alt" id="aiExample">Gợi ý yêu cầu</button><button class="btn alt" id="aiCopy">Sao chép</button><button class="btn" disabled title="Chỉ kích hoạt sau khi kết nối Backend">Gửi Gemini (chưa kết nối)</button></div><p id="aiFeedback" role="status" class="muted">Yêu cầu chưa được gửi đi. Chưa có API key trong Frontend.</p></div></div>`}
function bindAi(){const role=$('aiRole');if(!role)return;role.onchange=()=>{window.msAiRole=role.value;window.msAiSpace=role.value==='teacher'?'research':'tutor';window.msAiDraft=null;render('ai')};$('aiSpace').onchange=()=>{window.msAiSpace=$('aiSpace').value;window.msAiDraft=null;render('ai')};$('aiPrompt').oninput=()=>{window.msAiDraft=$('aiPrompt').value};$('aiExample').onclick=()=>{window.msAiDraft=null;render('ai')};$('aiCopy').onclick=async()=>{const t=$('aiPrompt').value;try{await navigator.clipboard.writeText(t);$('aiFeedback').textContent='Đã sao chép yêu cầu.'}catch(e){$('aiPrompt').select();$('aiFeedback').textContent='Không có quyền clipboard; hãy sao chép văn bản đã chọn.'}}}

function render(p=page){page=p;$('nav').innerHTML=sections.map(([id,name])=>`<button class="${page===id?'active':''}" data-page="${id}">${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));const fn={home,learn,practice,exam,bank,matrix,creator,research,progress,audit,settings,ai}[page];$('app').innerHTML=fn();bind();if(page==='ai')bindAi();if(page==='exam'&&examStarted)startTicker()}
function home(){return `<div class="hero"><div><h2>Học tập thông minh · Tư duy HSG</h2><p>Chuyên đề, luyện tập, ma trận đề và đánh giá năng lực Toán 12</p></div><img src="./icon-192.png" alt="Logo MathSphere"></div><div class="note"><b>Trạng thái: Bản chạy thử độc lập.</b> Dữ liệu lưu trên chính thiết bị này; chưa có tài khoản, đồng bộ máy chủ hoặc AI trực tuyến. Các câu hỏi mẫu chỉ phục vụ kiểm tra chức năng, không phải ngân hàng HSG đã kiểm định 6 vòng.</div><div class="grid"><div class="card"><h3>Câu hỏi mẫu</h3><div class="metric">${data.questions.length}</div><p>Ngân hàng nội bộ trên thiết bị</p></div><div class="card"><h3>Lượt làm bài</h3><div class="metric">${data.attempts.length}</div><p>Đã lưu trong trình duyệt</p></div><div class="card"><h3>Ma trận đã lưu</h3><div class="metric">${data.matrices.length}</div><p>Chưa phát hành đề chính thức</p></div></div><div class="two"><div class="card"><h3>Học sinh bắt đầu</h3><p>Chọn chuyên đề hoặc luyện tập với các câu hỏi mẫu.</p><div class="actions"><button class="btn" data-go="practice">Luyện tập</button><button class="btn alt" data-go="learn">Xem chuyên đề</button></div></div><div class="card"><h3>Không gian thiết kế đề</h3><p>Lập ma trận, bản đặc tả và xuất hồ sơ chuyển cho “Bạn ra đề”.</p><div class="actions"><button class="btn orange" data-go="matrix">Thiết kế ma trận</button><button class="btn alt" data-go="research">Nghiên cứu nguồn</button></div></div></div>`}
const topics=['Đạo hàm','Mũ – logarit','Nguyên hàm – tích phân','Vectơ – tọa độ','Xác suất','Toán thực tiễn','Tổng hợp HSG'];function learn(){return `<h2>Chuyên đề bồi dưỡng Toán 12</h2><div class="note">Phạm vi chưa triển khai: bất đẳng thức nâng cao, thể tích khối tròn xoay, đường thẳng trong Oxyz. Giáo viên cần xác nhận tiến độ học thực tế trước khi phát hành đề.</div><div class="grid">${topics.map(t=>`<div class="card"><h3>${t}</h3><p>${data.questions.filter(q=>q.topic===t).length} câu hỏi mẫu</p><button class="btn alt" data-topic="${t}">Luyện chủ đề</button></div>`).join('')}</div>`}
function questionUI(q,i){let base=`<div class="q"><div><strong>Câu ${i+1}. ${esc(q.prompt)}</strong></div><div class="muted">${esc(q.topic)} · ${levels[q.level]||q.level} · ${context[q.context]} · ${comp[q.competency]} ${q.type==='TF'?'· '+(q.scheme==='independent'?'4 ý độc lập':'4 ý bậc thang'):''}</div>`;if(q.type==='MCQ')base+=`<div class="choices">${q.options.map((x,j)=>`<label><input type="radio" name="ans_${q.id}" value="${j}" ${answers[q.id]===j?'checked':''}>${'ABCD'[j]}. ${esc(x)}</label>`).join('')}</div>`;if(q.type==='TF')base+=`<div class="choices">${q.statements.map((s,j)=>`<div style="padding:8px;border:1px solid var(--line);border-radius:9px"><b>${'abcd'[j]})</b> ${esc(s)}<div class="checkrow"><label><input type="radio" name="ans_${q.id}_${j}" value="true" ${answers[q.id]?.[j]===true?'checked':''}> Đúng</label><label><input type="radio" name="ans_${q.id}_${j}" value="false" ${answers[q.id]?.[j]===false?'checked':''}> Sai</label></div></div>`).join('')}</div>`;if(q.type==='SA')base+=`<label>Trả lời ngắn<input data-short="${q.id}" value="${esc(answers[q.id]??'')}" placeholder="Nhập kết quả"></label>`;return base+'</div>'}
function practice(){const list=data.questions.filter(q=>q.status==='DEMO'||q.status==='APPROVED');return `<h2>Luyện tập</h2><div class="toolbar"><select id="filterTopic"><option value="">Tất cả chuyên đề</option>${topics.map(t=>`<option>${t}</option>`).join('')}</select><select id="filterType"><option value="">Tất cả dạng câu hỏi</option>${Object.keys(types).map(t=>`<option value="${t}">${types[t]}</option>`).join('')}</select><button class="btn alt" id="filterBtn">Lọc</button></div><div class="note">Câu hỏi mẫu chưa được kiểm định 6 vòng và giáo viên phê duyệt; chỉ dùng để thử tính năng.</div><div id="practiceList" class="list">${list.map(questionUI).join('')}</div><div class="actions"><button class="btn orange" id="submitPractice">Nộp bài và chấm</button><button class="btn alt" id="clearAnswers">Làm lại</button></div><div id="scorePanel"></div>`}
function getPoints(q){const a=answers[q.id];if(q.type==='MCQ')return a===q.answer?1:0;if(q.type==='SA')return String(a??'').trim().replace(',','.')===String(q.answer).trim().replace(',','.')?1:0;if(q.type==='TF'){const correct=q.answer.reduce((n,v,i)=>n+(a?.[i]===v?1:0),0);return q.scheme==='independent'?correct*.25:[0,.1,.25,.5,1][correct]}return 0}
function showResult(ids,kind){if(submitted||!ids.length){if(!ids.length)alert('Chưa có câu hỏi để chấm.');return}submitted=true;let qs=ids.map(qBy).filter(Boolean),sum=qs.reduce((n,q)=>n+getPoints(q),0),max=qs.length;data.attempts.unshift({id:'A'+Date.now(),date:new Date().toISOString(),kind,ids,score:sum,max,answers:JSON.parse(JSON.stringify(answers))});save();if(kind.startsWith('Thi thử')){persistExam();clearExam()}$('scorePanel').innerHTML=`<div class="card" style="margin-top:16px"><h3>Kết quả ${esc(kind)}</h3><div class="result">${fmt(sum)} / ${max} điểm</div><p>Chấm theo đáp án mẫu. Chưa có xác thực học sinh hoặc giám sát thi.</p>${qs.map((q,i)=>`<div class="q"><b>Câu ${i+1}: ${fmt(getPoints(q))} / 1 điểm</b><p>${esc(q.solution)}</p></div>`).join('')}</div>`;$('scorePanel').scrollIntoView({behavior:'smooth',block:'start'});if($('submitPractice'))$('submitPractice').disabled=true;if($('submitExam'))$('submitExam').disabled=true}
function exam(){return `<h2>Thi thử</h2><div class="card"><h3>Đề luyện tập trên thiết bị</h3><p>Chọn số câu, hệ thống lấy từ ngân hàng mẫu. Không phải kỳ thi chính thức; dữ liệu không được đồng bộ lên máy chủ.</p><div class="two"><div><label>Số câu</label><select id="examCount">${[3,5,7,10,20].map(n=>`<option value="${n}" ${n===5?'selected':''}>${n} câu</option>`).join('')}</select></div><div><label>Thời lượng dự kiến (phút)</label><input id="examTime" type="number" min="1" max="240" value="30"></div></div><div class="actions"><button class="btn" id="startExam">Tạo đề luyện thử</button></div></div><div id="examArea">${examStarted?examQuestions():''}</div><div id="scorePanel"></div>`}
function examQuestions(){return `<div class="card" style="margin-top:16px"><h3>Đề luyện thử · ${examIds.length} câu</h3><p id="elapsed" role="timer" aria-live="off">Thời gian còn lại: --:--</p><p class="muted">Tự động nộp khi hết giờ. Bài làm được lưu tạm trên thiết bị.</p><div class="list">${examIds.map((id,i)=>questionUI(qBy(id),i)).join('')}</div><div class="actions"><button class="btn orange" id="submitExam">Nộp đề</button></div></div>`}
function bank(){return `<h2>Ngân hàng câu hỏi</h2><div class="note">Mỗi câu hiện có nhãn DEMO, không phải đã PASS 6 vòng. Chỉ câu được giáo viên thẩm định và duyệt mới được phát hành chính thức khi có backend phân quyền.</div><div class="actions"><button class="btn alt" id="exportBank">Xuất JSON ngân hàng</button><button class="btn alt" id="importBank">Nhập JSON</button><input id="bankFile" type="file" accept=".json,application/json" class="hidden"></div><div class="list" style="margin-top:15px">${data.questions.map(q=>`<div class="card"><b>${esc(q.id)} · ${esc(q.prompt)}</b><div><span class="pill">${esc(q.topic)}</span><span class="pill">${esc(q.type)}</span><span class="pill">${esc(q.level)}</span><span class="pill">${esc(q.context)}</span><span class="pill">${esc(q.competency)}</span><span class="pill">${esc(q.status)}</span></div></div>`).join('')}</div>`}
function matrix(){return `<h2>Bạn thiết kế ma trận và đặc tả</h2><div class="note">Bản này tạo ma trận cấu trúc và đặc tả từ cấu hình giáo viên; <b>chưa gọi AI trực tuyến</b>. Xuất JSON để chuyển cho “Bạn ra đề” ở hệ thống AI được kết nối sau này.</div><div class="two"><div class="card"><h3>Tiêu chí đề</h3><label>Tên đề</label><input id="mxName" value="Đề luyện HSG Toán 12"><label>Số câu</label><input id="mxCount" type="number" min="1" max="100" value="22"><label>Chuyên đề (chọn nhiều)</label><div class="checkrow">${topics.map((t,i)=>`<label><input type="checkbox" class="mxTopic" value="${t}" ${i<5?'checked':''}> ${t}</label>`).join('')}</div><label>Mức độ nhận thức</label><div class="checkrow">${Object.entries(levels).map(([v,t])=>`<label><input type="checkbox" class="mxLevel" value="${v}" checked> ${t}</label>`).join('')}</div><label>Dạng toán</label><div class="checkrow">${Object.entries(context).map(([v,t])=>`<label><input type="checkbox" class="mxContext" value="${v}" checked> ${t}</label>`).join('')}</div><label>Năng lực trọng tâm</label><div class="checkrow">${Object.entries(comp).map(([v,t])=>`<label><input type="checkbox" class="mxComp" value="${v}" checked> ${t}</label>`).join('')}</div><label>Hình thức câu hỏi</label><div class="checkrow">${Object.entries(types).map(([v,t])=>`<label><input type="checkbox" class="mxType" value="${v}" checked> ${t}</label>`).join('')}</div><label>Đúng/Sai – quy tắc thiết kế và chấm</label><select id="mxScheme"><option value="independent">4 ý độc lập, tương đương – 0,25 mỗi ý</option><option value="ladder">4 ý bậc thang H→VD→VDC→VDC+ – 0,1/0,25/0,5/1 theo số ý đúng</option></select><label>Phạm vi kiến thức / yêu cầu riêng</label><textarea id="mxNote">Không ra bất đẳng thức nâng cao, thể tích khối tròn xoay hoặc đường thẳng Oxyz khi chưa học.</textarea><div class="actions"><button class="btn" id="buildMatrix">Lập ma trận</button></div></div><div class="card"><h3>Ma trận và đặc tả</h3><div id="mxOutput">Chọn tiêu chí và bấm “Lập ma trận”.</div></div></div>`}
function checked(cls){return [...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value)}function buildMatrix(){let count=Number($('mxCount').value),topics=checked('mxTopic'),lv=checked('mxLevel'),ct=checked('mxContext'),cp=checked('mxComp'),ty=checked('mxType');if(!Number.isInteger(count)||count<1||count>100||![topics,lv,ct,cp,ty].every(a=>a.length)){alert('Chọn ít nhất một giá trị mỗi nhóm và số câu từ 1 đến 100.');return}let cells=topics.flatMap(t=>lv.map(l=>({topic:t,level:l,count:0})));for(let i=0;i<count;i++)cells[i%cells.length].count++;let items=[];for(let i=0;i<count;i++){let c=cells.find(x=>x.count>0);items.push({position:i+1,topic:c.topic,level:c.level,context:ct[i%ct.length],competency:cp[i%cp.length],type:ty[i%ty.length],tfScheme:ty[i%ty.length]==='TF'?$('mxScheme').value:null,sublevel:ty[i%ty.length]==='TF'&&$('mxScheme').value==='ladder'?'a:H,b:VD,c:VDC,d:VDC+ (mặc định gợi ý)':null,requirements:$('mxNote').value});c.count--}let totals={};items.forEach(x=>{let k=x.topic+'|'+x.level;totals[k]=(totals[k]||0)+1});let matrix={id:'MX'+Date.now(),name:$('mxName').value,count,topics,levels:lv,contexts:ct,competencies:cp,types:ty,scheme:$('mxScheme').value,note:$('mxNote').value,items,status:'DRAFT_NOT_APPROVED',created:new Date().toISOString()};data.draft=matrix;save();$('mxOutput').innerHTML=`<div class="good">Đã phân bổ đủ <b>${count}/${count}</b> câu. Đây là đề xuất theo thuật toán chia đều, chưa có AI thẩm định chuyên môn.</div><div class="scroll"><table><thead><tr><th>Chủ đề</th>${lv.map(x=>`<th>${x}</th>`).join('')}<th>Tổng</th></tr></thead><tbody>${topics.map(t=>`<tr><td>${esc(t)}</td>${lv.map(l=>`<td>${totals[t+'|'+l]||0}</td>`).join('')}<td>${items.filter(x=>x.topic===t).length}</td></tr>`).join('')}<tr><th>Tổng</th>${lv.map(l=>`<th>${items.filter(x=>x.level===l).length}</th>`).join('')}<th>${count}</th></tr></tbody></table></div><h3>Đặc tả từng vị trí</h3><div class="scroll"><table><tr><th>Câu</th><th>Chủ đề</th><th>Mức</th><th>Dạng toán</th><th>NL</th><th>Hình thức</th></tr>${items.map(x=>`<tr><td>${x.position}</td><td>${esc(x.topic)}</td><td>${x.level}</td><td>${x.context}</td><td>${x.competency}</td><td>${x.type}</td></tr>`).join('')}</table></div><div class="actions"><button class="btn alt" id="exportMatrix">Xuất JSON chuyển Bạn ra đề</button><button class="btn alt" id="exportMatrixCSV">Xuất CSV ma trận</button><button class="btn" id="saveMatrix">Lưu bản dự thảo</button></div>`;bindMatrixActions()}

function validateQuestion(q){if(!q||typeof q!=='object'||typeof q.id!=='string'||!/^[A-Za-z0-9_-]{1,60}$/.test(q.id)||typeof q.prompt!=='string'||q.prompt.length<5||q.prompt.length>10000||!['MCQ','TF','SA'].includes(q.type))return false;if(!['B','H','VD','VDC'].includes(q.level)||!['TT','TH'].includes(q.context)||!['TDLL','MHH','GQVD'].includes(q.competency)||!topics.includes(q.topic)||typeof q.solution!=='string')return false;if(q.type==='MCQ')return Array.isArray(q.options)&&q.options.length===4&&q.options.every(x=>typeof x==='string')&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4;if(q.type==='TF')return ['independent','ladder'].includes(q.scheme)&&Array.isArray(q.statements)&&q.statements.length===4&&q.statements.every(x=>typeof x==='string')&&Array.isArray(q.answer)&&q.answer.length===4&&q.answer.every(x=>typeof x==='boolean');return typeof q.answer==='string'||typeof q.answer==='number'}
function creator(){let m=data.draft;return `<h2>Bạn ra đề · Bàn giao đặc tả</h2><div class="note">Frontend V2 chỉ lập phiếu nhiệm vụ và xuất tệp chuyển giao. Chưa kết nối mô hình AI, không tự sinh câu hỏi hoặc tuyên bố đã phản biện.</div>${m?`<div class="card"><h3>Ma trận hiện hành: ${esc(m.name)}</h3><p>${m.items.length} vị trí · Trạng thái: ${esc(m.status)}</p><div class="actions"><button class="btn alt" id="creatorExport">Xuất phiếu nhiệm vụ JSON</button><button class="btn alt" id="creatorPrompt">Xuất hướng dẫn Bạn ra đề TXT</button></div></div>`:'<div class="card">Chưa có ma trận. Vào mục Ma trận – Đặc tả để tạo trước.</div>'}<div class="card"><h3>Quy tắc chuyển giao</h3><p>Mỗi vị trí phải có chuyên đề, dạng câu, mức độ, năng lực, dạng toán và phương thức Đúng/Sai nếu áp dụng. AI cần lập A1–A3 cho đề bài và B1–B3 cho lời giải; giáo viên duyệt trước khi phát hành.</p><p>VDC+ là nhãn phân hóa HSG thuộc mức VDC; ý d có thể là câu khóa, không mặc định mọi câu đều phải VDC+.</p></div>`}
function audit(){return `<h2>Kiểm định câu hỏi · 6 cổng</h2><div class="note">Đây là bảng theo dõi thủ công, không phải AI đã chạy kiểm định. Không thể đánh dấu PASS tự động khi chưa có bộ kiểm định độc lập.</div><div class="card"><h3>Trạng thái ngân hàng</h3><div class="scroll"><table><tr><th>Mã</th><th>Chủ đề</th><th>Trạng thái</th><th>Kiểm định</th></tr>${data.questions.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.topic)}</td><td>${esc(q.status)}</td><td>${q.status==='DEMO'?'CHƯA KIỂM ĐỊNH':q.status==='PENDING_REVIEW'?'CHỜ DUYỆT':'CẦN HỒ SƠ MINH CHỨNG'}</td></tr>`).join('')}</table></div></div><div class="card"><h3>Danh mục sáu vòng</h3>${['A1: Phản biện tính xác định của đề','A2: Giải độc lập và phát hiện mâu thuẫn','A3: Kiểm tra mức độ, năng lực, dạng toán và tính phân hóa','B1: Giải lại không tham chiếu lời giải gốc','B2: Kiểm tra bằng biến đổi toán học/công cụ phù hợp','B3: Soát lời giải, đáp án, định dạng và nhất quán'].map((x,i)=>`<div class="step"><b>${i+1}</b>${x}</div>`).join('')}</div>`}
function handoffPrompt(m){return `MATHSPHERE HSG12 PRO - PHIẾU GIAO VIỆC CHO BẠN RA ĐỀ\nTên đề: ${m.name}\nSố câu: ${m.items.length}\nTrạng thái: ${m.status}\nPhạm vi: ${m.note}\nYÊU CẦU: Không tự ý thay đổi ma trận. Với mỗi vị trí tạo đề, đáp án, lời giải; thực hiện ba phản biện đề A1-A3 và ba phản biện lời giải B1-B3 độc lập, báo lỗi khi không xác minh được. Mọi câu hỏi cần giáo viên duyệt trước phát hành.\n\nCHI TIẾT VỊ TRÍ\n${m.items.map(x=>`${x.position}. ${x.topic} | ${x.level}${x.sublevel?' ('+x.sublevel+')':''} | ${x.context} | ${x.competency} | ${x.type} | ${x.tfScheme||'-'} | ${x.requirements||''}`).join('\n')}`}

function research(){return `<h2>Bạn nghiên cứu Toán học toàn cầu</h2><div class="note">Chưa tích hợp công cụ tìm kiếm/AI qua backend. Các liên kết dưới đây mở nguồn tham khảo thực; không tuyên bố đã thu thập hay kiểm định nội dung. Không tự động sao chép tài liệu có bản quyền.</div><div class="grid">${[['IMO','https://www.imo-official.org/problems.aspx','Đề Olympic Toán học quốc tế'],['AoPS','https://artofproblemsolving.com/','Diễn đàn và tài nguyên giải toán'],['arXiv Mathematics','https://arxiv.org/archive/math','Bài nghiên cứu Toán học'],['NRICH','https://nrich.maths.org/','Bài toán và tư duy Toán'],['MAA','https://maa.org/','Tài nguyên giáo dục Toán học'],['Google Scholar','https://scholar.google.com/','Tra cứu nghiên cứu đa ngôn ngữ']].map(([n,u,d])=>`<div class="card"><h3>${n}</h3><p>${d}</p><a class="btn alt" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener noreferrer" href="${u}">Mở nguồn ↗</a></div>`).join('')}</div><div class="card"><h3>Quy trình AI toàn cầu khi kết nối backend</h3>${['Tìm kiếm đa ngôn ngữ và ghi URL nguồn','Sàng lọc theo phạm vi học và quyền sử dụng','Phân tích ý tưởng, đối chiếu trùng lặp','Tạo câu hỏi mới theo đặc tả đã duyệt','Phản biện đề A1–A3 và lời giải B1–B3','Giáo viên duyệt trước khi phát hành'].map((s,i)=>`<div class="step"><b>${i+1}</b><span>${s}</span></div>`).join('')}</div>`}
function progress(){return `<h2>Kết quả học tập trên thiết bị</h2><div class="card"><p>Chỉ lưu trong trình duyệt hiện tại. Xóa dữ liệu trình duyệt sẽ mất kết quả nếu chưa xuất bản sao.</p><div class="scroll"><table><tr><th>Thời điểm</th><th>Loại</th><th>Số câu</th><th>Điểm</th></tr>${data.attempts.map(a=>`<tr><td>${new Date(a.date).toLocaleString('vi-VN')}</td><td>${esc(a.kind)}</td><td>${a.ids.length}</td><td>${fmt(a.score)}/${a.max}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có lượt làm bài</td></tr>'}</table></div><div class="actions"><button class="btn alt" id="exportResults">Xuất kết quả JSON</button></div></div><div class="note">Rasch/PCM cần dữ liệu trả lời nhiều học sinh, phân quyền và kiểm định mô hình; chưa triển khai ở bản này.</div>`}
function settings(){return `<h2>Cài đặt và triển khai</h2><div class="two"><div class="card"><h3>Thông tin phiên bản</h3><p>MathSphere · HSG12 PRO V2.0 – GitHub Pages / PWA</p><p>Chế độ: ngoại tuyến, dữ liệu cục bộ, không có API key trong mã nguồn.</p><label>Tên hiển thị khi thử nghiệm</label><input id="profile" value="${esc(data.profile)}"><div class="actions"><button class="btn" id="saveProfile">Lưu tên</button><button class="btn alt" id="exportAll">Sao lưu toàn bộ JSON</button></div></div><div class="card"><h3>Giới hạn và an toàn</h3><p>Chưa có đăng nhập an toàn, phân quyền máy chủ, đồng bộ đa thiết bị, AI trực tuyến, kiểm định 6 vòng tự động hoặc lưu bài tập vào Drive.</p><p>Không dùng bản này để thu thập dữ liệu cá nhân học sinh hay tổ chức thi chính thức.</p><div class="actions"><button class="btn alt" id="clearDemo">Xóa dữ liệu thử trên thiết bị</button></div></div></div><div class="card"><h3>Khi triển khai chính thức</h3><p>GitHub Pages chỉ lưu giao diện. Cần backend xác thực, lưu bài làm, phân quyền và AI Gateway riêng; khóa API phải nằm phía máy chủ. Mã nguồn không tự ý ghi đè bản GitHub hiện có.</p></div>`}
function download(name,content,type='application/json'){const blob=new Blob([content],{type:type+';charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}
function bindMatrixActions(){if($('exportMatrix'))$('exportMatrix').onclick=()=>download('HSG12_MA_TRAN_DAC_TA.json',JSON.stringify(data.draft,null,2));if($('exportMatrixCSV'))$('exportMatrixCSV').onclick=()=>download('HSG12_MA_TRAN_DAC_TA.csv',csv([['Câu','Chủ đề','Mức độ','Dạng toán','Năng lực','Hình thức','Đúng/Sai'],...data.draft.items.map(x=>[x.position,x.topic,x.level,x.context,x.competency,x.type,x.tfScheme])]),'text/csv');if($('saveMatrix'))$('saveMatrix').onclick=()=>{data.matrices.unshift(data.draft);save();alert('Đã lưu bản dự thảo trên thiết bị. Chưa được giáo viên duyệt.')};}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{render('practice');$('filterTopic').value=b.dataset.topic;$('filterBtn').click()});document.querySelectorAll('input[type=radio][name^="ans_"]').forEach(x=>x.onchange=()=>{let s=x.name.split('_'),id=s[1],q=qBy(id);if(q.type==='TF'){answers[id]??=[null,null,null,null];answers[id][Number(s[2])]=x.value==='true'}else answers[id]=Number(x.value);if(examStarted)persistExam()});document.querySelectorAll('[data-short]').forEach(x=>x.oninput=()=>{answers[x.dataset.short]=x.value;if(examStarted)persistExam()});
if($('filterBtn'))$('filterBtn').onclick=()=>{let t=$('filterTopic').value,k=$('filterType').value,qs=data.questions.filter(q=>['DEMO','APPROVED'].includes(q.status)&&(!t||q.topic===t)&&(!k||q.type===k));$('practiceList').innerHTML=qs.map(questionUI).join('')||'<div class="card">Không có câu hỏi phù hợp.</div>';bindAnswerOnly()};if($('submitPractice'))$('submitPractice').onclick=()=>showResult([...$('practiceList').querySelectorAll('.q')].map(el=>{let radio=el.querySelector('input[name^="ans_"]'),short=el.querySelector('[data-short]');return radio?.name.split('_')[1]||short?.dataset.short}).filter(Boolean),'Luyện tập');if($('clearAnswers'))$('clearAnswers').onclick=()=>{answers={};submitted=false;render('practice')};if($('startExam'))$('startExam').onclick=()=>{if(examStarted&&!submitted&&!confirm('Đang có bài thi chưa nộp. Thầy/cô có muốn bỏ bài hiện tại và tạo đề mới?'))return;clearExam();answers={};submitted=false;let n=Number($('examCount').value);examMinutes=Math.min(240,Math.max(1,Number($('examTime').value)||30));examIds=data.questions.filter(q=>['DEMO','APPROVED'].includes(q.status)).slice(0,n).map(q=>q.id);examStarted=true;examStart=Date.now();persistExam();$('examArea').innerHTML=examQuestions();bindAnswerOnly();startTicker();$('submitExam').onclick=()=>{showResult(examIds,'Thi thử')}};if($('submitExam'))$('submitExam').onclick=()=>{showResult(examIds,'Thi thử')};if($('buildMatrix'))$('buildMatrix').onclick=buildMatrix;bindMatrixActions();if($('creatorExport'))$('creatorExport').onclick=()=>download('HSG12_BAN_GIAO_BAN_RA_DE.json',JSON.stringify(data.draft,null,2));if($('creatorPrompt'))$('creatorPrompt').onclick=()=>download('HSG12_LENH_BAN_RA_DE.txt',handoffPrompt(data.draft),'text/plain');if($('exportBank'))$('exportBank').onclick=()=>download('HSG12_NGAN_HANG_DEMO.json',JSON.stringify(data.questions,null,2));if($('importBank'))$('importBank').onclick=()=>$('bankFile').click();if($('bankFile'))$('bankFile').onchange=async e=>{try{let arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr)||arr.length>500||!arr.every(validateQuestion))throw Error('Dữ liệu không hợp lệ');if(!confirm('Nhập '+arr.length+' câu vào ngân hàng cục bộ? Tất cả câu nhập được đánh dấu CHỜ DUYỆT.'))return;let existing=new Set(data.questions.map(q=>q.id));for(let q of arr)if(!existing.has(q.id)){data.questions.push({...q,status:'PENDING_REVIEW'});existing.add(q.id)}save();render('bank')}catch(e){alert('Không thể nhập: '+e.message)}};if($('exportResults'))$('exportResults').onclick=()=>download('HSG12_KET_QUA.json',JSON.stringify(data.attempts,null,2));if($('exportAll'))$('exportAll').onclick=()=>download('HSG12_SAO_LUU.json',JSON.stringify(data,null,2));if($('saveProfile'))$('saveProfile').onclick=()=>{data.profile=$('profile').value.trim().slice(0,100);save();alert('Đã lưu tên trên thiết bị')};if($('clearDemo'))$('clearDemo').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu thử nghiệm trên thiết bị này?')){localStorage.removeItem(KEY);localStorage.removeItem(EXAM_KEY);location.reload()}}}
function bindAnswerOnly(){document.querySelectorAll('input[type=radio][name^="ans_"]').forEach(x=>x.onchange=()=>{let s=x.name.split('_'),id=s[1],q=qBy(id);if(q.type==='TF'){answers[id]??=[null,null,null,null];answers[id][Number(s[2])]=x.value==='true'}else answers[id]=Number(x.value);if(examStarted)persistExam()});document.querySelectorAll('[data-short]').forEach(x=>x.oninput=()=>{answers[x.dataset.short]=x.value;if(examStarted)persistExam()})}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='inline-block'});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));restoreExam();render();if(examStarted)startTicker();
</script></body></html>
